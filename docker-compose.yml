version: '3.8'

services:
  # ---- MySQL Database ----
  mysql:
    image: mysql:8.0
    container_name: shivbaempire_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-shivbaempire}
      MYSQL_USER: ${DB_USER:-shivba_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      # CRITICAL: Data persists across deployments
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:3306:3306"  # Bind to localhost only
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - shivba_network

  # ---- Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shivbaempire_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shivbaempire}
      DB_USER: ${DB_USER:-shivba_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://yourdomain.com}
      APP_URL: ${APP_URL:-https://yourdomain.com}
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - shivba_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---- Frontend (served by Nginx) ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shivbaempire_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - shivba_network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # ---- Nginx Reverse Proxy ----
  nginx:
    image: nginx:alpine
    container_name: shivbaempire_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - shivba_network

volumes:
  # CRITICAL: MySQL data volume — never delete this in production
  mysql_data:
    driver: local
    name: shivbaempire_mysql_data
  certbot_webroot:
  certbot_certs:

networks:
  shivba_network:
    driver: bridge
    name: shivbaempire_network
